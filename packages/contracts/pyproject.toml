[project]
name = "gamesense-contracts"
version = "0.1.0"
description = "Shared GameSense data contracts (source of truth for JSON Schema and TypeScript types)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamesense_contracts"]
