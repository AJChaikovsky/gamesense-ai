[project]
name = "gamesense-engine"
version = "0.1.0"
description = "GameSense local engine: capture, perception, coaching, knowledge, memory"
requires-python = ">=3.12"
dependencies = [
  "gamesense-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "python-dotenv>=1.0",
  "anthropic>=1.0",
  "google-genai>=1.0",
  "openai>=3.0",
  "psutil>=6.0",
  "windows-capture>=2.0; sys_platform == 'win32'",
]

[project.scripts]
gamesense-engine = "gamesense.__main__:main"
gamesense-eval = "gamesense.evals.cli:main"

[tool.uv.sources]
gamesense-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamesense"]
