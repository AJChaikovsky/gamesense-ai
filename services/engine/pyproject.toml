[project]
name = "gamesense-engine"
version = "0.1.0"
description = "GameSense local engine: capture, perception, coaching, knowledge, memory"
requires-python = ">=3.12"
dependencies = [
  "gamesense-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[project.scripts]
gamesense-engine = "gamesense.__main__:main"

[tool.uv.sources]
gamesense-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamesense"]
